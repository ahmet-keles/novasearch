services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: novasearch-postgres
    environment:
      POSTGRES_DB: novasearch
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d novasearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: novasearch-redis
    ports:
      - "6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
