name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: novasearch
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U nova -d novasearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NOVA_DATABASE_URL: postgresql+psycopg://nova:nova@localhost:5432/novasearch
      NOVA_REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run unit and integration tests
        run: pytest -q
